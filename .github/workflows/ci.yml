name: Publisher checks

# The offline publisher fixtures and release-gate checks on every push and pull
# request, behind the same localhost-only dead proxy the pipelines use. No
# secrets, no network, no write permission.
on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Python 3.11.15
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.11.15'
                  cache: pip
                  cache-dependency-path: scripts/cmems-requirements.lock

            - name: Install hash-locked producer dependencies
              run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/cmems-requirements.lock'

            - name: Run offline publisher contract fixtures
              env:
                  NO_PROXY: '127.0.0.1,localhost,::1'
                  HTTPS_PROXY: 'http://127.0.0.1:9'
                  HTTP_PROXY: 'http://127.0.0.1:9'
                  ALL_PROXY: 'http://127.0.0.1:9'
              run: |
                  export no_proxy="$NO_PROXY"
                  export https_proxy="$HTTPS_PROXY"
                  export http_proxy="$HTTP_PROXY"
                  export all_proxy="$ALL_PROXY"
                  python -m unittest discover -s scripts/publisher-tests -p 'test_*.py'
