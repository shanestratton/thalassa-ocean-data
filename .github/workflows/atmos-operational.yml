name: Atmosphere bounded ongoing publication (held by repository variable)
on:
  schedule:
    - cron: '47 4,10,16,22 * * *'
    - cron: '47 8,20 * * *'
  workflow_dispatch:
    inputs:
      dataset:
        type: choice
        options: [gfs-atmos, ifs-pressure]
        default: gfs-atmos
        required: true
      allow_provider_downloads:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
permissions: {}
concurrency:
  group: publisher-atmos-${{ github.event_name == 'schedule' && (github.event.schedule == '47 4,10,16,22 * * *' && 'gfs-atmos' || 'ifs-pressure') || inputs.dataset }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  EVENT_SCHEDULE: ${{ github.event.schedule }}
  SCHEDULE_ENABLED: ${{ vars.THALASSA_ATMOS_SCHEDULE_ENABLED }}
  REQUEST_DATASET: ${{ inputs.dataset }}
  ALLOW_DOWNLOADS: ${{ inputs.allow_provider_downloads && 'true' || 'false' }}
  ALLOW_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
jobs:
  proof:
    if: github.ref == 'refs/heads/master' && github.repository == 'shanestratton/thalassa-ocean-data' && github.actor == 'shanestratton' && github.run_attempt == 1 && ((github.event_name == 'schedule' && vars.THALASSA_ATMOS_SCHEDULE_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.allow_provider_downloads == true && inputs.publish == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cmems-source
            lock: scripts/cmems-requirements.lock
            suite: scripts/publisher-tests
            expected: 126
          - name: atmos-native
            lock: scripts/atmos-requirements.lock
            suite: scripts/atmos-native-tests
            expected: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout actual immutable master producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python3.11.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.15'
      - name: Verify production authority and preserve exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor b60f8796429d2c71f95790ece690cf52202e90e8 HEAD
          printf '%s  %s\n' '2433715b578eb7adfac8421aa50a02332a31f8b4c2ef9d13b000daaffd027504' scripts/atmos_production_runner.py | sha256sum --check --strict
          test ! -e "$RUNNER_TEMP/atmos141-operational-proof"
          mkdir "$RUNNER_TEMP/atmos141-operational-proof"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/atmos141-operational-proof/source.txt"
          python -B - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          from atmos_production_runner import verify_proven_source
          verify_proven_source(Path.cwd())
          PY
      - name: Install only this separate exact production hash lock
        env:
          PROOF_LOCK: ${{ matrix.lock }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r "$PROOF_LOCK" 2>&1 | tee "$RUNNER_TEMP/atmos141-operational-proof/install.log"
          python -m pip check 2>&1 | tee "$RUNNER_TEMP/atmos141-operational-proof/pip-check.txt"
          python -m pip freeze > "$RUNNER_TEMP/atmos141-operational-proof/packages.txt"
      - name: Original126 or native7 plus concrete production controls
        env:
          PROOF_NAME: ${{ matrix.name }}
          PROOF_SUITE: ${{ matrix.suite }}
          PROOF_EXPECTED: ${{ matrix.expected }}
          NO_PROXY: '127.0.0.1,localhost,::1'
          HTTPS_PROXY: 'http://127.0.0.1:9'
          HTTP_PROXY: 'http://127.0.0.1:9'
          ALL_PROXY: 'http://127.0.0.1:9'
        shell: bash
        run: |
          set -euo pipefail
          export no_proxy="$NO_PROXY" https_proxy="$HTTPS_PROXY" http_proxy="$HTTP_PROXY" all_proxy="$ALL_PROXY"
          if [[ "$PROOF_NAME" == atmos-native ]]; then ulimit -v 2097152; fi
          set +e
          python -B - <<'PY' 2>&1 | tee "$RUNNER_TEMP/atmos141-operational-proof/unittest.log"
          import json,os,sys,unittest
          from pathlib import Path
          directory,expected=os.environ['PROOF_SUITE'],int(os.environ['PROOF_EXPECTED'])
          suite=unittest.TestLoader().discover(directory,pattern='test_*.py')
          assert suite.countTestCases()==expected
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped and result.testsRun==expected
          forbidden={'xarray','netCDF4','h5py','rasterio'} if os.environ['PROOF_NAME']=='atmos-native' else {'eccodes'}
          assert not forbidden.intersection(sys.modules)
          report={'source':os.environ['GITHUB_SHA'],'suite':directory,'run':result.testsRun,'skipped':len(result.skipped),'pass':True}
          if os.environ['PROOF_NAME']=='cmems-source':
              extra=unittest.TestLoader().discover('scripts/atmos-production-tests',pattern='test_*.py')
              assert extra.countTestCases()==23
              extra_result=unittest.TextTestRunner(verbosity=2).run(extra)
              assert extra_result.wasSuccessful() and not extra_result.skipped
              report['newProductionCases']=extra_result.testsRun
              operational=unittest.TestLoader().discover('scripts/atmos-operational-tests',pattern='test_*.py')
              assert operational.countTestCases()==36
              operational_result=unittest.TextTestRunner(verbosity=2).run(operational)
              assert operational_result.wasSuccessful() and not operational_result.skipped
              report['operationalCases']=operational_result.testsRun
          report['loadedLibraries']=sorted({line.split()[-1] for line in Path('/proc/self/maps').read_text().splitlines() if '.so' in line and '/' in line})
          Path(os.environ['RUNNER_TEMP'],'atmos141-operational-proof','result.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > "$RUNNER_TEMP/atmos141-operational-proof/process-exit.txt"
          test "${statuses[0]}" = 0 && test "${statuses[1]}" = 0
      - name: Preserve proof on every outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atmos141-operational-proof-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/atmos141-operational-proof
          if-no-files-found: warn
          retention-days: 14

  plan:
    if: github.ref == 'refs/heads/master' && github.repository == 'shanestratton/thalassa-ocean-data' && github.actor == 'shanestratton' && github.run_attempt == 1 && ((github.event_name == 'schedule' && vars.THALASSA_ATMOS_SCHEDULE_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.allow_provider_downloads == true && inputs.publish == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      dataset: ${{ steps.plan.outputs.dataset }}
    steps:
      - name: Checkout exact actual master source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python3.11.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.15'
      - name: Bind actual GitHub source and source-lag eligible cycle
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s python -B scripts/atmos_operational.py plan

  generate:
    if: github.ref == 'refs/heads/master' && github.repository == 'shanestratton/thalassa-ocean-data' && github.actor == 'shanestratton' && github.run_attempt == 1 && ((github.event_name == 'schedule' && vars.THALASSA_ATMOS_SCHEDULE_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.allow_provider_downloads == true && inputs.publish == true))
    needs: [plan, proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      attempt-id: ${{ steps.attempt.outputs.artifact-id }}
    steps:
      - name: Checkout exact actual master source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python3.11.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.15'
      - name: Prepare fresh evidence and original native hash lock
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/atmos141-operational-generate/$GITHUB_RUN_ID"
          test ! -e "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/atmos-requirements.lock 2>&1 | tee "$EVIDENCE_DIR/install.log"
          python -m pip check
          python -m pip freeze > "$EVIDENCE_DIR/packages.txt"
      - name: Refuse any prior cycle attempt before preparing a marker
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s python -B scripts/atmos_operational.py prepare
      - name: Consume this cycle durably before the first provider read
        id: attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare.outputs.attempt-name }}
          path: ${{ env.EVIDENCE_DIR }}/attempt/attempt.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Acknowledge exact durable attempt and generate original whole cohort once
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT_ARTIFACT_ID: ${{ steps.attempt.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 2097152
          set +e
          timeout --signal=TERM --kill-after=10s 1200s python -B -u scripts/atmos_operational.py generate 2>&1 | tee "$EVIDENCE_DIR/generate.log"
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > "$EVIDENCE_DIR/process-exit.txt"
          test "${statuses[0]}" = 0 && test "${statuses[1]}" = 0
      - name: Preserve original observer and partial output on every outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atmos141-operational-evidence-${{ needs.plan.outputs.dataset }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          overwrite: false
      - name: Seal only this successful complete draft
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atmos141-operational-bundle-${{ needs.plan.outputs.dataset }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/output/bundle/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

  publish:
    if: github.ref == 'refs/heads/master' && github.repository == 'shanestratton/thalassa-ocean-data' && github.actor == 'shanestratton' && github.run_attempt == 1 && ((github.event_name == 'schedule' && vars.THALASSA_ATMOS_SCHEDULE_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.allow_provider_downloads == true && inputs.publish == true))
    needs: [plan, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact actual master source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python3.11.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.15'
      - name: Restore only this actual run's sealed bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atmos141-operational-bundle-${{ needs.plan.outputs.dataset }}-${{ github.run_id }}
          path: ${{ runner.temp }}/atmos141-operational-publish-bundle
      - name: Admit exact marker and cohort then invoke unchanged isolated writer
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT_ARTIFACT_ID: ${{ needs.generate.outputs.attempt-id }}
          ATMOS_DATASET: ${{ needs.plan.outputs.dataset }}
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/atmos141-operational-publish-proof"
          test ! -e "$EVIDENCE_DIR"
          mkdir "$EVIDENCE_DIR"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          export EVIDENCE_DIR BUNDLE_DIR="$RUNNER_TEMP/atmos141-operational-publish-bundle"
          printf '%s  %s\n' '3fcb7e836fc13a290425b4e3f075aa0fadaab3148ba3cbe703c9feda884f66c6' scripts/publish_dataset.py | sha256sum --check --strict
          set +e
          (timeout --signal=TERM --kill-after=5s 60s python -B scripts/atmos_operational.py publish-check && python -B scripts/publish_dataset.py --dataset "$ATMOS_DATASET" --bundle "$BUNDLE_DIR") 2>&1 | tee "$EVIDENCE_DIR/publish.log"
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > "$EVIDENCE_DIR/process-exit.txt"
          test "${statuses[0]}" = 0 && test "${statuses[1]}" = 0
      - name: Preserve actual publication outcome on every result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atmos141-operational-publish-${{ needs.plan.outputs.dataset }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14
