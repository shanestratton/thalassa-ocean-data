name: SSH 141 isolated offline publisher proof
on:
    push:
        branches: ['codex/build-141-ssh-observations']
        paths: ['.github/workflows/check-ssh141-offline.yml']
permissions:
    contents: read
concurrency:
    group: ssh141-isolated-offline-proof
    cancel-in-progress: false
jobs:
    offline:
        if: github.repository == 'shanestratton/thalassa-ocean-data' && github.actor == 'shanestratton' && github.run_attempt == 1
        name: offline (${{ matrix.name }})
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: cmems
                      lock: scripts/cmems-requirements.lock
                    - name: mpa
                      lock: scripts/mpa-pipeline/requirements.txt
        steps:
            - name: Checkout exact producer source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Set up Python 3.11.15
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.11.15'
            - name: Install only reviewed hash-locked wheels
              env:
                  LOCK: ${{ matrix.lock }}
              run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r "$LOCK"
            - name: Run every original and SSH fixture behind a dead proxy
              env:
                  NO_PROXY: '127.0.0.1,localhost,::1'
                  HTTPS_PROXY: 'http://127.0.0.1:9'
                  HTTP_PROXY: 'http://127.0.0.1:9'
                  ALL_PROXY: 'http://127.0.0.1:9'
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
                  test -z "$(git status --porcelain)"
                  export no_proxy="$NO_PROXY" https_proxy="$HTTPS_PROXY" http_proxy="$HTTP_PROXY" all_proxy="$ALL_PROXY"
                  mkdir -p "$RUNNER_TEMP/ssh141-offline-proof"
                  git rev-parse HEAD > "$RUNNER_TEMP/ssh141-offline-proof/source.txt"
                  python --version > "$RUNNER_TEMP/ssh141-offline-proof/python.txt"
                  python -m pip freeze > "$RUNNER_TEMP/ssh141-offline-proof/packages.txt"
                  sha256sum scripts/publisher_contract.py scripts/ssh_grid.py scripts/cmems-ssh-pipeline/pipeline.py scripts/publisher-tests/test_ssh_grid.py scripts/publisher-tests/fixtures/ssh-original-zarr-metadata.json scripts/cmems-requirements.lock scripts/mpa-pipeline/requirements.txt > "$RUNNER_TEMP/ssh141-offline-proof/source-sha256.txt"
                  python -m unittest discover -v -s scripts/publisher-tests -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/ssh141-offline-proof/unittest.log"
            - name: Preserve exact offline evidence on every outcome
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ssh141-offline-${{ matrix.name }}-${{ github.run_id }}
                  path: ${{ runner.temp }}/ssh141-offline-proof
                  if-no-files-found: warn
                  retention-days: 14
