name: Atmosphere 141 bounded IFS origin retry after backoff
on:
  push:
    branches: [codex/build-141-atmos-ifs-origin-once-retry-0731]
    paths: [.github/workflows/prove-atmos141-ifs-origin-once-retry-0731.yml]
permissions:
  contents: read
concurrency:
  group: atmos141-first-original-observation
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'shanestratton/thalassa-ocean-data' && github.actor == 'shanestratton' && github.run_attempt == 1 && github.ref == 'refs/heads/codex/build-141-atmos-ifs-origin-once-retry-0731'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 1ef0a7642b87d2db6e18007ac81f62221dcf699f
      GFS_RUN: '2026-10-17T00:00:00Z'
      IFS_RUN: '2026-10-16T12:00:00Z'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1ef0a7642b87d2db6e18007ac81f62221dcf699f
          persist-credentials: false
      - name: Isolated Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.15'
      - name: Record exact source and install reviewed atmospheric lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/atmos141-ifs-origin-once-retry-0731"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/atmos141-ifs-origin-once-retry-0731/source.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/atmos141-ifs-origin-once-retry-0731/control.txt"
          python --version > "$RUNNER_TEMP/atmos141-ifs-origin-once-retry-0731/python.txt"
          sha256sum scripts/atmos_contract.py scripts/atmos_pipeline.py scripts/publisher_contract.py scripts/prove_atmos_first_source.py scripts/atmos-requirements.lock > "$RUNNER_TEMP/atmos141-ifs-origin-once-retry-0731/source-sha256.txt"
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/atmos-requirements.lock 2>&1 | tee "$RUNNER_TEMP/atmos141-ifs-origin-once-retry-0731/install.log"
          python -m pip check > "$RUNNER_TEMP/atmos141-ifs-origin-once-retry-0731/pip-check.txt"
          python -m pip freeze > "$RUNNER_TEMP/atmos141-ifs-origin-once-retry-0731/packages.txt"
      - name: Observe only four original IFS responses without repeating GFS
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 2097152
          python -E -s -B scripts/prove_atmos_first_source.py --gfs-run "$GFS_RUN" --ifs-run "$IFS_RUN" --out "$RUNNER_TEMP/atmos141-ifs-origin-once-retry-0731/observation" --read-reviewed-first-source --ifs-only 2>&1 | tee "$RUNNER_TEMP/atmos141-ifs-origin-once-retry-0731/command.log"
          printf '0\n' > "$RUNNER_TEMP/atmos141-ifs-origin-once-retry-0731/process-exit.txt"
      - name: Preserve originals and refusal evidence on every outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atmos141-ifs-origin-once-retry-0731-${{ github.run_id }}
          path: ${{ runner.temp }}/atmos141-ifs-origin-once-retry-0731
          if-no-files-found: error
          retention-days: 14
